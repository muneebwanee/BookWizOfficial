name: "BookWiz \xB7 Apple-TV"
'on':
  workflow_dispatch: {}
  push:
    branches:
    - '**'
    tags:
    - tvos-v*
    paths:
    - source-tvos.zip
    - .github/workflows/build-tvos.yml
permissions:
  contents: read
concurrency:
  group: bookwiz-tvos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-mode:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.mode.outputs.build }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Route full repositories through version preparation
      id: mode
      env:
        BOOKWIZ_EVENT: ${{ github.event_name }}
        BOOKWIZ_REF_TYPE: ${{ github.ref_type }}
      run: 'python3 - <<''PYMODE''

        import os

        from pathlib import Path

        full=all(Path(p).exists()for p in [''package.json'',''tools/prepare-build-source.py'',''native/android'',''native/apple'',''native/desktop''])

        run=not(full and os.environ[''BOOKWIZ_EVENT'']==''push'' and os.environ[''BOOKWIZ_REF_TYPE'']!=''tag'')

        with open(os.environ[''GITHUB_OUTPUT''],''a'')as f:f.write(''build=''+str(run).lower()+''\n'')

        print(''This build was dispatched from prepared source.'' if run else ''The central version-preparation
        workflow dispatches builds for this full repository.'')

        PYMODE'
  build:
    if: ${{ needs.source-mode.outputs.build == 'true' && (github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: bookwiz
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Verify the source archive
      run: "python - <<'PYEXTRACT'\nimport hashlib,json,pathlib,stat,zipfile\n# Full-source repositories\
        \ build the checked-out edits; ZIP-only uploads still work.\nif pathlib.Path('tools/prepare-build-source.py').is_file()\
        \ and pathlib.Path('package.json').is_file():\n    import subprocess,sys\n    if pathlib.Path('release-state.json').is_file()and\
        \ all(pathlib.Path('native/'+n).is_dir()for n in ['android','apple','desktop']):subprocess.run([sys.executable,'tools/release-version.py','--check'],check=True)\n\
        \    subprocess.run([sys.executable,'tools/prepare-build-source.py','--target','tvos','--output','bookwiz'],check=True)\n\
        \    raise SystemExit(0)\nsource=pathlib.Path('source-tvos.zip')\nif not source.is_file():raise\
        \ SystemExit('Missing source-tvos.zip at the repository root.')\noutput=pathlib.Path('bookwiz').resolve();seen=set()\n\
        with zipfile.ZipFile(source)as archive:\n    entries=archive.infolist()\n    if len(entries)>10000\
        \ or sum(x.file_size for x in entries)>256*1024*1024:raise SystemExit('The source archive exceeds\
        \ the build limit.')\n    for entry in entries:\n        name=entry.filename;parts=pathlib.PurePosixPath(name)\n\
        \        if name in seen or parts.is_absolute() or '..'in parts.parts or '\\\\'in name or ':'in\
        \ name or stat.S_ISLNK(entry.external_attr>>16):raise SystemExit('Unsafe source archive path:\
        \ '+name)\n        seen.add(name)\n    manifest=json.loads(archive.read('SOURCE-MANIFEST.json'))\n\
        \    if manifest.get('platform')!='tvos':raise SystemExit('Use the matching tvos source ZIP and\
        \ workflow.')\n    if seen!=set(manifest['files'])|{'SOURCE-MANIFEST.json'}:raise SystemExit('The\
        \ archive contents differ from its source manifest. Regenerate the source ZIP after editing.')\n\
        \    for entry in entries:\n        data=archive.read(entry)\n        if entry.filename!='SOURCE-MANIFEST.json'\
        \ and hashlib.sha256(data).hexdigest()!=manifest['files'][entry.filename]:raise SystemExit('Source\
        \ checksum mismatch: '+entry.filename)\n        target=output/entry.filename;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\n\
        if not (output/'package.json').is_file():raise SystemExit('The source package does not contain\
        \ package.json.')\nprint('Verified and unpacked '+source.name+' into bookwiz/.')\nPYEXTRACT\n"
      working-directory: .
    - name: Check the bundled documentation
      run: python3 scripts/check_docs.py
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: bookwiz/package-lock.json
    - name: Install build and test dependencies
      run: npm ci --ignore-scripts
    - name: Check the application source
      run: npm run check
    - name: Run application tests
      run: npm test
    - name: Refresh the offline application cache
      run: node tools/version-cache.mjs
    - name: Verify Apple archive packaging
      run: python3 tests/apple-package.test.py
    - name: Prepare the offline studio and Xcode project
      run: 'node tools/prepare-native.mjs --target apple

        brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

        xcodebuild -version

        xcodegen generate --spec native/apple/project.yml

        python3 tools/check-apple-project.py --project native/apple/BookWiz.xcodeproj'
    - name: Compile an unsigned Apple device archive
      run: 'set -o pipefail

        mkdir -p release

        xcodebuild archive -project native/apple/BookWiz.xcodeproj -scheme ''BookWiz-tvOS'' -destination
        ''generic/platform=tvOS'' -archivePath ''release/BookWiz-tvOS.xcarchive'' CODE_SIGNING_ALLOWED=NO
        CODE_SIGNING_REQUIRED=NO | tee apple-build.log'
    - name: Package and verify the compiled device IPA
      run: python3 tools/package-apple.py --archive 'release/BookWiz-tvOS.xcarchive' --output 'release/BookWiz-Apple-TV-unsigned.ipa'
        --platform 'tvos'
    - name: Export a signed IPA when Apple signing is configured
      run: 'python3 - <<''PYCHECK''

        import os

        names=[''APPLE_CERTIFICATE_P12_BASE64'',''APPLE_CERTIFICATE_PASSWORD'',''APPLE_PROFILES_ZIP_BASE64'',''BOOKWIZ_APPLE_TEAM_ID'',''BOOKWIZ_APPLE_PROFILE_MAP'']

        present=[bool(os.environ.get(name))for name in names]

        if any(present)and not all(present):raise SystemExit(''The Apple signing configuration is incomplete.
        Configure all required signing secrets and variables, or remove them all for unsigned output.'')

        PYCHECK

        python3 tools/sign-apple.py ''BookWiz-tvOS'' ''generic/platform=tvOS''

        '
      env:
        APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_PROFILES_ZIP_BASE64: ${{ secrets.APPLE_PROFILES_ZIP_BASE64 }}
        BOOKWIZ_APPLE_TEAM_ID: ${{ vars.BOOKWIZ_APPLE_TEAM_ID }}
        BOOKWIZ_APPLE_PROFILE_MAP: ${{ vars.BOOKWIZ_APPLE_PROFILE_MAP }}
        BOOKWIZ_APPLE_EXPORT_METHOD: ${{ vars.BOOKWIZ_APPLE_EXPORT_METHOD }}
    - name: Verify packages and record release metadata
      run: node tools/ci-release.mjs --target tvos --prepare-only
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: BookWiz-packages-tvos-${{ github.run_id }}
        path: 'bookwiz/release/*.ipa

          bookwiz/release/*.ipa.json

          bookwiz/release/Apple-exports/**/*.ipa

          bookwiz/release/SHA256SUMS.txt

          bookwiz/release/BUILD-INFO.json'
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: Keep Apple build diagnostics if the build fails
      if: failure()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: BookWiz-Apple-diagnostics-${{ github.run_id }}
        path: 'bookwiz/apple-build.log

          bookwiz/native/apple/BookWiz.xcodeproj/project.pbxproj

          '
        if-no-files-found: warn
        retention-days: 14
    needs: source-mode
