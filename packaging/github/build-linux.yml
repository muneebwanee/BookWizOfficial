# BookWizOfficial · linux source build
name: BookWiz · Linux
'on':
  workflow_dispatch: {}
  push:
    branches:
    - '**'
    tags:
    - linux-v*
    paths:
    - 'source-linux.zip'
    - '.github/workflows/build-linux.yml'
    - 'dist/**'
    - 'tools/**'
    - 'scripts/**'
    - 'tests/**'
    - 'docs/**'
    - '**/*.md'
    - 'package*.json'
    - 'LICENSE*'
    - 'LICENSES/**'
    - 'THIRD_PARTY_NOTICES'
    - 'CITATION.cff'
    - '.gitignore'
    - 'packaging/github/**'
    - '.github/workflows/sync-source-archives.yml'
    - 'native/desktop/**'
permissions:
  contents: write
concurrency:
  group: bookwiz-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: bookwiz
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Verify the source archive
      run: |
        python - <<'PYEXTRACT'
        import hashlib,json,pathlib,stat,zipfile
        # Full-source repositories build the checked-out edits; ZIP-only uploads still work.
        if pathlib.Path('tools/prepare-build-source.py').is_file() and pathlib.Path('package.json').is_file():
            import subprocess,sys
            subprocess.run([sys.executable,'tools/prepare-build-source.py','--target','linux','--output','bookwiz'],check=True)
            raise SystemExit(0)
        source=pathlib.Path('source-linux.zip')
        if not source.is_file():raise SystemExit('Missing source-linux.zip at the repository root.')
        output=pathlib.Path('bookwiz').resolve();seen=set()
        with zipfile.ZipFile(source)as archive:
            entries=archive.infolist()
            if len(entries)>10000 or sum(x.file_size for x in entries)>256*1024*1024:raise SystemExit('The source archive exceeds the build limit.')
            for entry in entries:
                name=entry.filename;parts=pathlib.PurePosixPath(name)
                if name in seen or parts.is_absolute() or '..'in parts.parts or '\\'in name or ':'in name or stat.S_ISLNK(entry.external_attr>>16):raise SystemExit('Unsafe source archive path: '+name)
                seen.add(name)
            manifest=json.loads(archive.read('SOURCE-MANIFEST.json'))
            if manifest.get('platform')!='linux':raise SystemExit('Use the matching linux source ZIP and workflow.')
            if seen!=set(manifest['files'])|{'SOURCE-MANIFEST.json'}:raise SystemExit('The archive contents differ from its source manifest. Regenerate the source ZIP after editing.')
            for entry in entries:
                data=archive.read(entry)
                if entry.filename!='SOURCE-MANIFEST.json' and hashlib.sha256(data).hexdigest()!=manifest['files'][entry.filename]:raise SystemExit('Source checksum mismatch: '+entry.filename)
                target=output/entry.filename;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
        if not (output/'package.json').is_file():raise SystemExit('The source package does not contain package.json.')
        print('Verified and unpacked '+source.name+' into bookwiz/.')
        PYEXTRACT
      working-directory: .
    - name: Check the bundled documentation
      run: python3 scripts/check_docs.py
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: bookwiz/package-lock.json
    - name: Install build and test dependencies
      run: npm ci
    - name: Check the application source
      run: npm run check
    - name: Run application tests
      run: npm test
    - name: Refresh the offline application cache
      run: node tools/version-cache.mjs
    - name: Install Linux packaging utilities
      run: |-
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libarchive-tools rpm
    - name: Bundle the offline studio
      run: node tools/prepare-native.mjs --target desktop
    - name: Build Linux packages
      run: npx electron-builder --config native/desktop/electron-builder.yml --linux AppImage deb --x64 --publish never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: BookWiz-Linux-${{ github.run_id }}
        path: |-
          bookwiz/release/*.AppImage
          bookwiz/release/*.deb
        if-no-files-found: error
        retention-days: 14
    - name: Publish packages and checksums to GitHub Releases
      run: node tools/ci-release.mjs --target linux
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
