name: BookWiz
options:
  bundleIdPrefix: com.muneebwanee.bookwiz
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.20"
    CURRENT_PROJECT_VERSION: 34
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(BOOKWIZ_APPLE_TEAM_ID)"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BookWiz-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: [Web, Info.plist, BookWiz.entitlements]
      - path: Shared/LocalHTTPServer.swift
      - path: iOS/Web
        type: folder
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: iOS/BookWiz.entitlements
        INFOPLIST_FILE: iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.muneebwanee.bookwiz
        PROVISIONING_PROFILE_SPECIFIER: "$(BOOKWIZ_IOS_PROFILE)"
        PRODUCT_NAME: BookWiz
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: BookWiz-Widgets
        embed: true
      - target: BookWiz-Watch
        embed: true
    scheme:
      gatherCoverageData: false
  BookWiz-Watch:
    # SwiftUI single-target watchOS app: the legacy WatchKit type creates a second stub executable.
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: [Info.plist]
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Watch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.muneebwanee.bookwiz.watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: "$(BOOKWIZ_WATCH_PROFILE)"
        PRODUCT_NAME: BookWiz Watch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    scheme: {}
  BookWiz-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: TV
        excludes: [Info.plist]
      - path: Shared/LocalHTTPServer.swift
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: TV/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.muneebwanee.bookwiz.tv
        PROVISIONING_PROFILE_SPECIFIER: "$(BOOKWIZ_TV_PROFILE)"
        PRODUCT_NAME: BookWiz TV
        TARGETED_DEVICE_FAMILY: "3"
    scheme: {}

  BookWiz-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist, BookWiz.entitlements]
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/BookWiz.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.muneebwanee.bookwiz.widgets
        PRODUCT_NAME: BookWiz Widgets
        PROVISIONING_PROFILE_SPECIFIER: "$(BOOKWIZ_WIDGET_PROFILE)"
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
