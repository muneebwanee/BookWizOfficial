name: BookWiz · Windows
'on':
  workflow_dispatch: {}
  push:
    branches:
    - '**'
    tags:
    - windows-v*
    paths:
    - source-windows.zip
    - .github/workflows/build-windows.yml
permissions:
  contents: read
concurrency:
  group: bookwiz-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-mode:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.mode.outputs.build }}
      combined: ${{ steps.mode.outputs.combined }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Route full repositories through version preparation
      id: mode
      env:
        BOOKWIZ_EVENT: ${{ github.event_name }}
        BOOKWIZ_REF_TYPE: ${{ github.ref_type }}
      run: |-
        python3 - <<'PYMODE'
        import os
        from pathlib import Path
        full=all(Path(p).exists()for p in ['package.json','tools/prepare-build-source.py','native/android','native/apple','native/desktop'])
        run=not(full and os.environ['BOOKWIZ_EVENT']=='push' and os.environ['BOOKWIZ_REF_TYPE']!='tag')
        with open(os.environ['GITHUB_OUTPUT'],'a')as f:f.write('build='+str(run).lower()+'\ncombined='+str(full).lower()+'\n')
        print('This build was dispatched from prepared source.' if run else 'The central version-preparation workflow dispatches builds for this full repository.')
        PYMODE
  build:
    if: ${{ needs.source-mode.outputs.build == 'true' && (github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: bookwiz
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Verify the source archive
      run: |
        python - <<'PYEXTRACT'
        import hashlib,json,pathlib,stat,zipfile
        # Full-source repositories build the checked-out edits; ZIP-only uploads still work.
        if pathlib.Path('tools/prepare-build-source.py').is_file() and pathlib.Path('package.json').is_file():
            import subprocess,sys
            if pathlib.Path('release-state.json').is_file()and all(pathlib.Path('native/'+n).is_dir()for n in ['android','apple','desktop']):subprocess.run([sys.executable,'tools/release-version.py','--check'],check=True)
            subprocess.run([sys.executable,'tools/prepare-build-source.py','--target','windows','--output','bookwiz'],check=True)
            raise SystemExit(0)
        source=pathlib.Path('source-windows.zip')
        if not source.is_file():raise SystemExit('Missing source-windows.zip at the repository root.')
        output=pathlib.Path('bookwiz').resolve();seen=set()
        with zipfile.ZipFile(source)as archive:
            entries=archive.infolist()
            if len(entries)>10000 or sum(x.file_size for x in entries)>256*1024*1024:raise SystemExit('The source archive exceeds the build limit.')
            for entry in entries:
                name=entry.filename;parts=pathlib.PurePosixPath(name)
                if name in seen or parts.is_absolute() or '..'in parts.parts or '\\'in name or ':'in name or stat.S_ISLNK(entry.external_attr>>16):raise SystemExit('Unsafe source archive path: '+name)
                seen.add(name)
            manifest=json.loads(archive.read('SOURCE-MANIFEST.json'))
            if manifest.get('platform')!='windows':raise SystemExit('Use the matching windows source ZIP and workflow.')
            if seen!=set(manifest['files'])|{'SOURCE-MANIFEST.json'}:raise SystemExit('The archive contents differ from its source manifest. Regenerate the source ZIP after editing.')
            for entry in entries:
                data=archive.read(entry)
                if entry.filename!='SOURCE-MANIFEST.json' and hashlib.sha256(data).hexdigest()!=manifest['files'][entry.filename]:raise SystemExit('Source checksum mismatch: '+entry.filename)
                target=output/entry.filename;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
        if not (output/'package.json').is_file():raise SystemExit('The source package does not contain package.json.')
        print('Verified and unpacked '+source.name+' into bookwiz/.')
        PYEXTRACT
      working-directory: .
    - name: Check the bundled documentation
      run: python3 scripts/check_docs.py
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: bookwiz/package-lock.json
    - name: Install build and test dependencies
      run: npm ci
    - name: Check the application source
      run: npm run check
    - name: Run application tests
      run: npm test
    - name: Refresh the offline application cache
      run: node tools/version-cache.mjs
    - name: Bundle the offline studio
      run: node tools/prepare-native.mjs --target desktop
    - name: Build one Windows installer for x64 and ARM64
      run: npx electron-builder --config native/desktop/electron-builder.yml --win nsis --x64 --arm64
        --publish never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    - name: Verify packages and record release metadata
      run: node tools/ci-release.mjs --target windows --prepare-only
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: BookWiz-packages-windows-${{ github.run_id }}
        path: |-
          bookwiz/release/*.exe
          bookwiz/release/SHA256SUMS.txt
          bookwiz/release/BUILD-INFO.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    needs: source-mode
  publish-ready:
    name: Queue current downloads
    needs:
    - source-mode
    - build
    if: ${{ needs.source-mode.outputs.combined == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
    - name: Explicitly queue the combined release publisher
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BOOKWIZ_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |-
        python3 - <<'PYQUEUE'
        import json,os,re,urllib.request,urllib.error
        repository=os.environ['GITHUB_REPOSITORY'];branch=os.environ['BOOKWIZ_DEFAULT_BRANCH']
        if not re.fullmatch(r'[-\w.]+/[-\w.]+',repository)or not branch:raise SystemExit('The publication repository or default branch is missing.')
        api=os.environ.get('GITHUB_API_URL','https://api.github.com').rstrip('/')
        if not api.startswith('https://'):raise SystemExit('Use an HTTPS GitHub API.')
        request=urllib.request.Request(api+'/repos/'+repository+'/actions/workflows/publish-current-release.yml/dispatches',data=json.dumps({'ref':branch}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
        try:
            with urllib.request.urlopen(request,timeout=45):pass
        except urllib.error.HTTPError as error:
            raise SystemExit('Publication could not be queued (GitHub '+str(error.code)+'). This job requires Actions write permission.')
        print('Queued the shared download publisher using workflow_dispatch. It verifies all eight editions before publication.')
        PYQUEUE
