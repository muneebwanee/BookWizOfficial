name: Source checks

'on':
  pull_request:
    paths:
      - '**/*.md'
      - 'dist/**'
      - 'native/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'LICENSE*'
      - 'LICENSES/**'
      - 'package*.json'
      - 'packaging/**'
      - '.github/workflows/source-checks.yml'
  push:
    paths:
      - '**/*.md'
      - 'dist/**'
      - 'native/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'LICENSE*'
      - 'LICENSES/**'
      - 'package*.json'
      - 'packaging/**'
      - '.github/workflows/source-checks.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bookwiz-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Detect the editable source tree
        id: source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          ready = all(Path(name).is_file() for name in ['package.json', 'package-lock.json', 'dist/app.js'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Editable source is ready.' if ready else 'Source import has not run yet; checks begin when the editable tree is present.')
          PY
      - uses: actions/setup-node@v7.1.0
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.source.outputs.ready == 'true'
        run: |
          npm ci --ignore-scripts
          python3 -m pip install 'PyYAML>=6.0.2,<7'
      - name: Check and test the shared application
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 scripts/check_docs.py
          npm run check
          npm test
      - name: Check source import, star history, and platform packaging
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 tests/source-import.test.py
          python3 tests/star-history.test.py
          python3 tests/docs.test.py
          python3 tests/apple-package.test.py
          python3 tests/android-bundletool.test.py
          python3 tests/platform-kits.test.py
