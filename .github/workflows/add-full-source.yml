        \ <<'BOOKWIZ_FILE_66a82470ce7e4dbb'\n<div align=\"center\">\n\n# One source. Every writing room.\n\n**Clone\
        \ BookWiz, make a focused change, and contribute directly.**\n\n[BookWizOfficial](https://github.com/muneebwanee/BookWizOfficial)\
        \ · [Build guide](BUILDING.md) · [Contributing](../CONTRIBUTING.md)\n\n</div>\n\n---\n\nThe repository contains\
        \ the full editable source tree **and** the existing platform ZIPs. A normal clone gives contributors the\
        \ application, native hosts, build tools, tests, documentation, screenshots, and source archives together.\
        \ There is no extra extraction step before working on the code.\n\n## Find your place\n\n| Path | What lives\
        \ here |\n| :--- | :--- |\n| `dist/` | Shared browser writing studio, modules, styles, icons, fonts, and\
        \ offline assets. This is editable application source. |\n| `native/android/` | Android host and its platform\
        \ resources. |\n| `native/apple/` | iPhone/iPad, Widgets, Apple Watch, and Apple TV targets. |\n| `native/desktop/`\
        \ | Windows, macOS, and Linux desktop host and packaging configuration. |\n| `tools/` | Build, export, compiler,\
        \ cache, and platform packaging tools. |\n| `tests/` | Application and packaging regression tests. |\n|\
        \ `scripts/` | Repository utilities, including the self-hosted star-history generator and archive importer.\
        \ |\n| `docs/` | Contributor guides, platform notes, and documentation assets. |\n| `packaging/github/`\
        \ | Build-workflow templates used by the platform source packager. |\n| `.github/workflows/` | Active repository\
        \ workflows, including the retained release builds. |\n| `SOURCE-ORIGINS.json` | The source archives and\
        \ hashes used to assemble the editable tree. |\n\n## Start from a clone\n\n```sh\ngit clone https://github.com/muneebwanee/BookWizOfficial.git\n\
        cd BookWizOfficial\nnpm ci --ignore-scripts\nnpm run check\nnpm test\npython3 -m http.server 4173 --directory\
        \ dist --bind 127.0.0.1\n```\n\nOpen **http://localhost:4173**. Use the [build guide](BUILDING.md) for a\
        \ native edition.\n\n## The retained ZIPs\n\n| Archive | Distribution snapshot |\n| :--- | :--- |\n| `source-android.zip`\
        \ | Shared studio and Android host. |\n| `source-ios.zip`, `source-watchos.zip`, `source-tvos.zip` | Shared\
        \ studio and the related Apple targets. |\n| `source-windows.zip`, `source-macos.zip`, `source-linux.zip`\
        \ | Shared studio and desktop host. |\n| `source-web.zip` | Browser studio without native hosts. |\n\nThe\
        \ ZIPs remain available for the existing release workflows and people who prefer a platform-specific snapshot.\
        \ The initial addition of editable source leaves every ZIP byte for byte intact. Existing releases, tags,\
        \ and release assets are retained.\n\nContributors should change the editable files and submit a pull request.\
        \ Maintainers can produce refreshed platform snapshots when preparing a release:\n\n```sh\nnpm run package:source\n\
        ```\n\nThis writes new archives and matching build files to `build/platform-sources/`. It does not replace\
