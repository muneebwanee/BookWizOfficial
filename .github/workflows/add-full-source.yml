# Adds editable source from the existing verified ZIPs; preserves all downloads and releases.
name: Add full source
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/add-full-source.yml
permissions:
  contents: write
concurrency:
  group: bookwiz-add-full-source
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'muneebwanee/BookWizOfficial' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Record the existing repository files
      run: |
        python3 - <<'PY'
        import hashlib, json, os, subprocess
        from pathlib import Path
        allowed = {'README.md', 'CONTRIBUTING.md', 'LICENSE', 'TERMS.md', '.gitignore', 'SOURCE-ORIGINS.json',
                   'docs/BUILDING.md', 'docs/SOURCE_ARCHIVES.md', 'docs/STUDIO_README.md',
                   'docs/assets/star-history.svg', 'docs/assets/star-history.json', 'tools/package-platform-kits.py'}
        for platform in ['android', 'ios', 'watchos', 'tvos', 'windows', 'macos', 'linux', 'web']:
            allowed.update([f'README-{platform}.md', f'docs/platforms/{platform}.md'])
        names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
        hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names if name and name not in allowed}
        destination = Path(os.environ['RUNNER_TEMP']) / 'bookwiz-preserved-files.json'
        destination.write_text(json.dumps(hashes))
        print(f'Recorded {len(hashes)} existing files to preserve, including source ZIPs and release workflows.')
        PY
    - name: Add the unified editable source, guides and licensing scope
      run: "set -euo pipefail\nmkdir -p scripts tests docs LICENSES\nif [ ! -e 'LICENSES/BWNCL-1.0.txt' ]; then\n\
        cat > 'LICENSES/BWNCL-1.0.txt.bookwiz-new' <<'BOOKWIZ_FILE_f3f66adc6de01dde'\nBookWiz Non-Commercial License\
        \ 1.0\nBWNCL 1.0\n\nBWNCL 1.0 · Copyright © 2026 muneebwanee. All rights reserved except as granted below.\n\
        \n\n## Permissions\nYou may inspect and study the source, run BookWiz privately for personal non-commercial\
        \ use, and make private modifications. You may submit patches and contributions to the official BookWiz\
        \ repository designated by muneebwanee. You may share the minimum source excerpts necessary for a contribution\
        \ or a good-faith security report.\n\nYou may create a GitHub fork of github.com/muneebwanee/BookWizOfficial\
        \ for study and non-commercial upstream contributions. Retain copyright, license and third-party notices,\
        \ and identify the official project. This permission does not extend to unofficial packaged releases, commercial\
        \ hosting, resale or rebranding.\n\n\n## Restrictions\nExcept for the GitHub contribution forks permitted\
        \ above, you may not distribute, mirror, sublicense, or publish standalone copies of BookWiz or modified\
        \ versions, including source or packaged builds, without prior written permission from muneebwanee. You\
        \ may not sell, rent, license for payment, rebrand for resale, host as a commercial service, bundle for\
        \ commercial gain, or commercially exploit the software. Attribution does not waive these restrictions.\
        \ You may not imply endorsement or remove copyright and license notices.\n\n\n## Your books are excluded\n\
        This license governs the software, not works created with it. You retain 100% of your rights in your written\
        \ works and may publish, sell, license, and distribute them commercially. BookWiz claims no royalty or ownership\
        \ in your output. Third-party content and model terms remain separate.\n\n\n## Contributions\nBy submitting\
        \ an upstream contribution, you confirm you have the right to do so and grant muneebwanee a perpetual, worldwide,\
        \ non-exclusive, royalty-free right to use, modify, reproduce, and distribute that contribution as part\
        \ of official BookWiz releases. You retain copyright in your contribution.\n\n\n## Third-party components\n\
        Third-party libraries, fonts, and tools retain their own licenses. BWNCL does not narrow their independent\
        \ permissions. See THIRD_PARTY_NOTICES in the source distribution.\n\n\n## Termination and disclaimer\n\
        Permissions terminate upon breach. Stop using and remove unauthorized copies. The software is provided AS\
