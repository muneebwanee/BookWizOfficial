        \ this edition directly from a clone of BookWizOfficial, using the repository root that contains `package.json`.\
        \ The optional `source-{platform}.zip` snapshot also contains a self-contained edition for people who prefer\
        \ an archive.'\n        for relative in [f'README-{platform}.md', f'docs/platforms/{platform}.md']:\n  \
        \          path = root / relative\n            text = replace_once(path.read_text(), old, new, relative\
        \ + ' source setup')\n            if platform == 'web':\n                text = replace_once(text,\n   \
        \                 '`dist/` contains the studio. This archive excludes native hosts and downloaded installers.',\n\
        \                    '`dist/` contains the studio. The full repository also includes every native host;\
        \ the separate web source snapshot omits those hosts and downloaded installers.',\n                    relative\
        \ + ' web source scope')\n            write(path, text)\n\n    building = (root / 'docs/BUILDING.md').read_text()\n\
        \    building = replace_once(building,\n        \"Use **Node.js 24**, npm, and Python 3. Extract the source\
        \ archive for your platform and run these commands from the extracted folder containing `package.json`.\
        \ The [official repository](https://github.com/muneebwanee/BookWizOfficial) contains separate source ZIPs;\
        \ cloning it downloads those archives, which still need extraction.\",\n        'Use **Node.js 24**, npm,\
        \ and Python 3. Clone the [official repository](https://github.com/muneebwanee/BookWizOfficial) and run\
        \ these commands from its root, where `package.json`, `dist/`, `native/`, `tools/`, and `tests/` are already\
        \ available. The retained platform ZIPs are optional distribution snapshots; contributors work directly\
        \ in the editable tree.',\n        'build guide setup')\n    write(root / 'docs/BUILDING.md', building)\n\
        \n    terms = (root / 'TERMS.md').read_text()\n    if '## Code and documentation licenses' not in terms:\n\
        \        notice = '\\n## Code and documentation licenses\\n\\n`*.py`, `*.sh`, and other first-party source\
        \ files are BWNCL. `*.md` documentation, wordlists, regex catalogs, and rubrics are CC BY 4.0. These grants\
        \ also apply to corresponding first-party files inside the retained source ZIPs. Third-party licenses remain\
        \ separate. See [Licensing](docs/LICENSING.md), the [code license](LICENSES/BWNCL-1.0.txt), and [CC BY 4.0](LICENSES/CC-BY-4.0.txt).\\\
        n'\n        before, marker, footer = terms.rpartition('\\n---\\n\\n<div align=\"center\">')\n        terms\
        \ = before + notice + marker + footer if marker else terms + notice\n    write(root / 'TERMS.md', terms)\n\
        \n    packager = (root / 'tools/package-platform-kits.py').read_text()\n    packager = replace_once(packager,\n\
        \        \"name.startswith(('dist/','docs/','packaging/github/'))\",\n        \"name.startswith(('dist/','docs/','packaging/github/','LICENSES/','scripts/'))\"\
        ,\n        'platform source license inclusion')\n    write(root / 'tools/package-platform-kits.py', packager)\n\
        \    # Keep the standalone studio guide in step with the published README.\n    import importlib.util\n\
        \    spec = importlib.util.spec_from_file_location('bookwiz_packager', root / 'tools/package-platform-kits.py')\n\
        \    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    write(root\
        \ / 'docs/STUDIO_README.md', module.relocate_markdown_links(readme, 'README.md', 'docs/STUDIO_README.md'))\n\
        \    print(f'Editable source added: {len(report[\"created\"])} files; current ZIPs, release workflows, video\
        \ links, and other published files retained.')\n\n\nif __name__ == '__main__':\n    upgrade(Path.cwd())\n\
        BOOKWIZ_UPGRADE\n"
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Install build and test dependencies
      run: |
        npm ci --ignore-scripts
        python3 -m pip install 'PyYAML>=6.0.2,<7'
    - name: Verify the editable application and repository tools
      run: |
        npm run check
        npm test
        python3 tests/source-import.test.py
        python3 tests/star-history.test.py
        python3 tests/apple-package.test.py
        python3 tests/android-bundletool.test.py
        python3 tests/platform-kits.test.py
    - name: Generate the first repository-hosted star chart
      run: python3 scripts/gen_star_history.py
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify that existing downloads and release definitions were preserved
      run: |
        python3 - <<'PY'
        import hashlib, json, os
        from pathlib import Path
        hashes = json.loads((Path(os.environ['RUNNER_TEMP']) / 'bookwiz-preserved-files.json').read_text())
        for name, checksum in hashes.items():
            path = Path(name)
            if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != checksum:
                raise SystemExit('An existing protected file changed: ' + name)
        print('Existing source ZIPs, release workflows, icons, screenshots, videos and other protected files are unchanged.')
        PY
    - name: Commit the editable source and contributor updates
      run: |
        git add -- dist native tools tests scripts docs LICENSE LICENSES package.json package-lock.json .gitignore SOURCE-ORIGINS.json README.md CONTRIBUTING.md TERMS.md README-*.md
        if git diff --cached --quiet; then
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Add editable source for every platform, licensing scope and self-hosted star history'
        git fetch origin "$DEFAULT_BRANCH"
        git rebase "origin/$DEFAULT_BRANCH"
        git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
