name: Star history
'on':
  schedule:
  - cron: 17 6 * * *
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/star-history.yml
permissions:
  contents: write
concurrency:
  group: bookwiz-star-history
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'muneebwanee/BookWizOfficial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Refresh and commit the chart with push retries
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        for attempt in 1 2 3; do
          git fetch origin "refs/heads/$DEFAULT_BRANCH"
          git reset --hard FETCH_HEAD
          python3 scripts/gen_star_history.py
          git add -- docs/assets/star-history.svg docs/assets/star-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh self-hosted star history'
          if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then exit 0; fi
        done
        echo 'The chart push was rejected after three fresh retries. Check branch write access.' >&2
        exit 1
