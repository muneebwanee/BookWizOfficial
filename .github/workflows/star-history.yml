name: Star history

'on':
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bookwiz-star-history
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'muneebwanee/BookWizOfficial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Regenerate the repository-hosted chart
        run: python3 scripts/gen_star_history.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit only the generated chart and aggregate data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- docs/assets/star-history.svg docs/assets/star-history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh self-hosted star history'
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
